name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rm -rf probe; mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://live.cinematheque.ch/?interval=events" "https://live.cinematheque.ch/films/blue-moon" "https://live.cinematheque.ch/?interval=week" "https://search.ch/cine/?q=Nouvelle%20Vague" "https://search.ch/cine/?q=One%20Battle%20After%20Another"; do
            f=probe/$(echo "$u" | tr -c 'a-zA-Z0-9.' '_').html
            curl -sSL -A "$UA" -m 25 -o "$f" -w "%{http_code} %{url_effective} $u\n" "$u" >> probe/status.txt 2>&1 || echo "FAIL $u" >> probe/status.txt
          done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe; git commit -qm probe; git push
