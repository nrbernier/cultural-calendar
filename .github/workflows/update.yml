name: Update calendar

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays ~07:17 Swiss time
  workflow_dispatch:        # "Run workflow" button
  push:
    paths: [config.yaml, update.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build calendar
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python update.py
      # Runs even if one source failed (the run still shows red so you get an email).
      # Committing every week also stops GitHub from disabling the schedule after 60 idle days.
      - name: Commit
        if: always()
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Update calendar $(date -u +%F)" || echo "no changes"
          git push
