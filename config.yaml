# Calendar settings
calendar:
  name: "Culture"
  timezone: "Europe/Zurich"
  output: "docs/calendar.ics"

# --- Films -----------------------------------------------------------------
# TMDB (needs the TMDB_API_KEY secret) lists each director's films. The release
# date comes from search.ch for the Swiss region below (romandie, deutschschweiz,
# ticino), else TMDB's Swiss date, else a fallback country marked "CH TBC".
# If TMDB finds the wrong person, add `tmdb_id:` from the URL on themoviedb.org.
films:
  region: romandie
  country: CH
  fallback_countries: [FR]
  # Ignore films that were released more than this many days ago
  lookback_days: 60

directors:
  - name: Wes Anderson
  - name: Richard Linklater
  - name: Paul Thomas Anderson
  - name: Quentin Dupieux
  - name: Denis Villeneuve
  - name: Brady Corbet        # The Brutalist
  - name: Wim Wenders
  - name: Jacques Audiard
  - name: Daniel Kwan          # the Daniels
  - name: Daniel Scheinert
  - name: Todd Haynes

# --- Cinémathèque suisse -----------------------------------------------------
# Screenings on live.cinematheque.ch announced "en présence" of a guest.
# guests: mine = only the directors above, directors = any film-maker, all = anyone
cinematheque:
  enabled: true
  guests: all
  lookback_days: 30     # keep recent past screenings in the calendar

# --- Festivals ---------------------------------------------------------------
# Edit these by hand. `tentative: true` = estimated from previous years and not
# yet announced. The event is then titled with "(?)" and marked TENTATIVE.
# Milestone types: program, tickets, presale, lineup, or anything else.
festivals:
  - name: Rencontres 7e Art Lausanne
    url: https://www.rencontres7art.ch
    editions:
      - start: 2027-03-06
        end: 2027-03-13       # 10th edition, confirmed on rencontres7art.ch (checked 2026-11-25)
        milestones:
          - date: 2027-02-20
            type: tickets
            tentative: true   # 2026 ticketing opened 21 Feb

  - name: Cully Jazz Festival
    url: https://cullyjazz.ch
    editions:
      - start: 2027-04-02
        end: 2027-04-10       # 44th edition, confirmed by the festival (checked 2026-11-25)
        milestones:
          - date: 2027-04-08
            type: "🎷 Snarky Puppy (Chapiteau)"
            note: "Premier concert annoncé de la 44e édition. CHF 69, billets déjà en vente."
          - date: 2026-12-03
            type: lineup      # first names (2026 edition: 4 Dec)
            tentative: true
          - date: 2027-01-14
            type: program     # full IN program + ticketing opens at noon (2026: 15 Jan)
            tentative: true

  - name: Swiss Coffee Connection
    url: https://swisscoffeeconnection.ch
    editions:
      - start: 2026-10-10
        end: 2026-10-11       # 9th edition, Espace Amaretto, Lausanne
      - start: 2027-10-09
        end: 2027-10-10
        tentative: true       # usually a weekend in early/mid October

  - name: Festival Salamandre (Morges)
    url: https://festival-salamandre.org
    editions:
      - start: 2026-10-23
        end: 2026-10-25       # Parc de Vertou
      - start: 2027-10-22
        end: 2027-10-24
        tentative: true       # usually Fri–Sun in late October

  - name: Diabolo Festival (Morges)
    url: https://diabolofestival.ch
    editions:
      - start: 2026-06-20
        end: 2026-06-21       # Théâtre de Beausobre
      - start: 2027-06-19
        end: 2027-06-20
        tentative: true       # usually a weekend in mid/late June
