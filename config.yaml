# Calendar settings
calendar:
  name: "Culture"
  timezone: "Europe/Zurich"
  output: "docs/calendar.ics"

# --- Films -----------------------------------------------------------------
# TMDB (needs the TMDB_API_KEY secret) lists each director's films. The release
# date comes from search.ch for the Swiss region below (romandie, deutschschweiz,
# ticino), else TMDB's Swiss date, else a fallback country marked "CH TBC".
# If TMDB finds the wrong person, add `tmdb_id:` from the URL on themoviedb.org.
films:
  region: romandie
  country: CH
  fallback_countries: [FR]
  # Ignore films that were released more than this many days ago
  lookback_days: 60

directors:
  - name: Wes Anderson
  - name: Richard Linklater
  - name: Paul Thomas Anderson
  - name: Quentin Dupieux
  - name: Denis Villeneuve
  - name: Brady Corbet        # The Brutalist
  - name: Wim Wenders
  - name: Jacques Audiard

# --- Cinémathèque suisse -----------------------------------------------------
# Screenings on live.cinematheque.ch announced "en présence" of a guest.
# guests: mine = only the directors above, directors = any film-maker, all = anyone
cinematheque:
  enabled: true
  guests: all
  lookback_days: 30     # keep recent past screenings in the calendar

# --- Festivals ---------------------------------------------------------------
# Edit these by hand. `tentative: true` = estimated from previous years and not
# yet announced. The event is then titled with "(?)" and marked TENTATIVE.
# Milestone types: program, tickets, presale, lineup, or anything else.
festivals:
  - name: Rencontres 7e Art Lausanne
    url: https://www.rencontres7art.ch
    editions:
      - start: 2027-03-04
        end: 2027-03-14
        tentative: true       # 2024–2026 ran early-to-mid March
        milestones:
          - date: 2027-02-20
            type: tickets
            tentative: true   # 2026 ticketing opened 21 Feb

  - name: Cully Jazz Festival
    url: https://cullyjazz.ch
    editions:
      - start: 2027-04-02
        end: 2027-04-10       # per Lausanne Tourisme, not yet confirmed by the festival
        tentative: true
        milestones:
          - date: 2026-12-03
            type: lineup      # first names (2026 edition: 4 Dec)
            tentative: true
          - date: 2027-01-14
            type: program     # full IN program + ticketing opens at noon (2026: 15 Jan)
            tentative: true
